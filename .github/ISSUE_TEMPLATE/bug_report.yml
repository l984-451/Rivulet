name: Bug Report
description: Report a bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Saw a shiny new [AetherEngine](https://github.com/superuser404notfound/AetherEngine/releases) release?** I probably did too. It'll be in Rivulet within a week. Please give it 7 days before filing a "can we get the new AetherEngine thing" request. Thanks!

  - type: checkboxes
    id: search-check
    attributes:
      label: Before submitting
      options:
        - label: I have searched for existing issues
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where does the bug happen?
      options:
        - tvOS (Apple TV)
        - iOS / iPadOS
        - Both
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to replicate
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: App version and build number (e.g. 1.1.0 96)
      placeholder: "1.1.0 96"
    validations:
      required: true

  - type: input
    id: device-model
    attributes:
      label: Device
      description: Apple TV model from Settings → General → About, or your iPhone / iPad model
      placeholder: "Apple TV 4K (3rd generation)"
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: tvOS / iOS version
      description: Found in Settings → General → About
      placeholder: "26.1"
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Media server and version
      description: Plex Media Server version from Plex Web → Settings → General, or your Jellyfin version. Enter "N/A" if the bug is unrelated to a server.
      placeholder: "Plex 1.43.4"
    validations:
      required: true

  - type: textarea
    id: additional-info
    attributes:
      label: Any additional info
      placeholder: Any other context about the bug
