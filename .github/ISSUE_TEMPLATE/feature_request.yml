name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Saw a shiny new [AetherEngine](https://github.com/superuser404notfound/AetherEngine/releases) release?** I probably did too. It'll be in Rivulet within a week. Please give it 7 days before filing a "can we get the new AetherEngine thing" request. Thanks!

  - type: checkboxes
    id: search-check
    attributes:
      label: Before submitting
      options:
        - label: I have searched for existing feature requests
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which app should get this feature?
      options:
        - tvOS (Apple TV)
        - iOS / iPadOS
        - Both
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      placeholder: A clear description of what you'd like to see added
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      placeholder: Why would this feature be useful? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: additional-info
    attributes:
      label: Any additional context
      placeholder: Screenshots, mockups, or other context
